name: voicevox
label: VOICEVOX CORE
kind: standalone
version: 0.1.0
author: AokiApp Inc.
homepage: https://github.com/0ppaikoa/hermes-plugin-voicevox-tts
license: MIT
description: >
  VOICEVOX CORE as a Hermes Agent TTS provider — the synthesis library loaded
  in-process, with no engine process, no HTTP and no port. Replies are split
  into sentence-sized pieces before synthesis because one long call costs
  ~30 MB of resident memory per second of audio and can OOM the host, while
  sentence-at-a-time stays flat (~310 MB for a 4,000-character reply).
  First run: the voicevox_setup tool reports what is missing, prints the official
  licence text, and downloads only on an authorisation quoted from the conversation.
requires_hermes: ">=0.21.0"
provides_tools:
  - voicevox_setup
provides_hooks: []
optional_env:
  - name: HERMES_VOICEVOX_CORE_DIR
    description: "Directory holding onnxruntime/, dict/ and models/ (see the downloader)"
    prompt: "VOICEVOX CORE directory"
    password: false
  - name: HERMES_VOICEVOX_SPEAKER
    description: "Default style id (default 3 = ずんだもん（ノーマル）)"
    prompt: "VOICEVOX style id"
    password: false
